# Requires configured Upbound ProviderConfig objects named aws-default,
# gcp-default, and azure-default. This file is declarative only.
apiVersion: v1
kind: List
items:
  - apiVersion: ecr.aws.upbound.io/v1beta1
    kind: Repository
    metadata:
      name: declmig
      annotations:
        crossplane.io/external-name: declmig
    spec:
      deletionPolicy: Orphan
      forProvider:
        region: us-east-1
        imageTagMutability: IMMUTABLE
        encryptionConfiguration:
          - encryptionType: AES256
        imageScanningConfiguration:
          - scanOnPush: true
        tags:
          ManagedBy: crossplane
          Purpose: oci-images
      providerConfigRef:
        name: aws-default
  - apiVersion: artifactregistry.gcp.upbound.io/v1beta1
    kind: Repository
    metadata:
      name: declmig
    spec:
      deletionPolicy: Orphan
      forProvider:
        location: us-central1
        repositoryId: declmig
        description: OCI images for declarative-migrations
        format: DOCKER
        dockerConfig:
          - immutableTags: true
        labels:
          managed-by: crossplane
          purpose: oci-images
      providerConfigRef:
        name: gcp-default
  - apiVersion: azure.upbound.io/v1beta1
    kind: ResourceGroup
    metadata:
      name: declmig-oci
    spec:
      deletionPolicy: Orphan
      forProvider:
        location: East US
        tags:
          ManagedBy: crossplane
          Purpose: oci-images
      providerConfigRef:
        name: azure-default
  - apiVersion: containerregistry.azure.upbound.io/v1beta1
    kind: Registry
    metadata:
      name: declmigoci
      annotations:
        crossplane.io/external-name: declmigoci
    spec:
      deletionPolicy: Orphan
      forProvider:
        location: East US
        resourceGroupNameRef:
          name: declmig-oci
        sku: Basic
        adminEnabled: false
        publicNetworkAccessEnabled: true
        tags:
          ManagedBy: crossplane
          Purpose: oci-images
      providerConfigRef:
        name: azure-default
